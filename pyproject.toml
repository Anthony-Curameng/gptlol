[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wk-calculator"
version = "0.1.0"
description = "Local browser calculator for road carriageway Wk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.35", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["wkcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
