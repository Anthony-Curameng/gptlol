[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wk-calculator"
version = "1.0.0"
description = "Offline Windows carriageway lighting design-width calculator"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.7", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-qt>=4", "ruff>=0.6", "mypy>=1.10"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
wk-calculator = "wkcalc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wkcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
